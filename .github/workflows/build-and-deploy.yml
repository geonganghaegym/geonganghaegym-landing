name: build-and-deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/geonganghaegym/geonganghaegym-landing

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "value=sha-$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: seonwooj0810-homelab/homelab-gitops
          # homelab-gitops 한 레포에만 쓰기 권한이 있는 deploy key(키 제목 geonganghaegym-landing-bump).
          ssh-key: ${{ secrets.MANIFEST_REPO_DEPLOY_KEY }}
          ref: main

      - uses: imranismail/setup-kustomize@v3

      - name: Bump landing image tag
        working-directory: apps/geonganghaegym/landing
        run: |
          kustomize edit set image ghcr.io/geonganghaegym/geonganghaegym-landing=ghcr.io/geonganghaegym/geonganghaegym-landing:${{ needs.build-push.outputs.tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/geonganghaegym/landing/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "chore(landing): bump image to ${{ needs.build-push.outputs.tag }}"
          git push
